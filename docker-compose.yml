# Levantamiento evaluable en ≤15 min: ver scripts/docker-eval-up.sh
name: postop-voice-agent

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile
  target: runtime

x-backend-image: &backend-image postop-backend:local

# Acelera ingest-init dentro del contenedor (sin afectar desarrollo local).
x-ingest-tuning: &ingest-tuning
  PROTOCOL_GENERATION_DELAY_SECONDS: "0"
  OCR_ENABLED: "false"
  EMBEDDING_BATCH_SIZE: "64"

services:
  qdrant-db:
    image: qdrant/qdrant:v1.19.0
    container_name: postop-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - postop-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 2s
      retries: 8
      start_period: 5s

  backend-api:
    build: *backend-build
    image: *backend-image
    container_name: postop-backend-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *ingest-tuning
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: 6333
      TEXTOS_DIR: /app/data/textos
      PROTOCOL_DIR: /app/storage/protocols
      CALLS_LOG_DIR: /app/storage/logs/calls
      API_HOST: 0.0.0.0
      API_PORT: 8000
    command: ["postop-admin"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data/textos:/app/data/textos
      - ./storage/protocols:/app/storage/protocols
      - ./storage/logs:/app/storage/logs
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant-db:
        condition: service_healthy
    networks:
      - postop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/openapi.json"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  backend-voice:
    build: *backend-build
    image: *backend-image
    container_name: postop-backend-voice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *ingest-tuning
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: 6333
      TEXTOS_DIR: /app/data/textos
      PROTOCOL_DIR: /app/storage/protocols
      CALLS_LOG_DIR: /app/storage/logs/calls
      VOICE_WEB_HOST: 0.0.0.0
      VOICE_WEB_PORT: 7860
      VOICE_WEB_CORS_ORIGINS: ${VOICE_WEB_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    command: ["postop-voice-web"]
    ports:
      - "${VOICE_WEB_PORT:-7860}:7860"
    volumes:
      - ./data/textos:/app/data/textos
      - ./storage/protocols:/app/storage/protocols
      - ./storage/logs:/app/storage/logs
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant-db:
        condition: service_healthy
    networks:
      - postop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7860/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend-paciente:
    build:
      context: ./apps/voice-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_VOICE_API_URL: ${NEXT_PUBLIC_VOICE_API_URL:-http://localhost:7860}
    image: postop-frontend-paciente:local
    container_name: postop-frontend-paciente
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_VOICE_API_URL: ${NEXT_PUBLIC_VOICE_API_URL:-http://localhost:7860}
      VOICE_API_URL: http://backend-voice:7860
    ports:
      - "${FRONTEND_PACIENTE_PORT:-3000}:3000"
    depends_on:
      backend-voice:
        condition: service_healthy
    networks:
      - postop-net

  frontend-admin:
    build:
      context: ./apps/admin-ui
      dockerfile: Dockerfile
    image: postop-frontend-admin:local
    container_name: postop-frontend-admin
    restart: unless-stopped
    ports:
      - "${FRONTEND_ADMIN_PORT:-8080}:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - postop-net

  jupyter-notebook:
    profiles: ["analysis"]
    build:
      context: .
      dockerfile: Dockerfile
      target: jupyter
    image: postop-jupyter:local
    container_name: postop-jupyter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: 6333
      TEXTOS_DIR: /app/data/textos
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant-db:
        condition: service_healthy
    networks:
      - postop-net

  ingest-init:
    profiles: ["init"]
    build: *backend-build
    image: *backend-image
    container_name: postop-ingest-init
    env_file:
      - .env
    environment:
      <<: *ingest-tuning
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: 6333
      TEXTOS_DIR: /app/data/textos
      PROTOCOL_DIR: /app/storage/protocols
    command: ["postop-ingest", "--recreate"]
    volumes:
      - ./data/textos:/app/data/textos
      - ./storage/protocols:/app/storage/protocols
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant-db:
        condition: service_healthy
    networks:
      - postop-net

networks:
  postop-net:
    driver: bridge

volumes:
  qdrant_data:
  hf_cache:
