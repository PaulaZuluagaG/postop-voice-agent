name: postop-voice-agent

services:
  qdrant-db:
    image: qdrant/qdrant:v1.19.0
    container_name: postop-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - postop-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: postop-backend-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: 6333
      TEXTOS_DIR: /app/dataset/textos
      PROTOCOL_DIR: /app/storage/protocols
      CALLS_LOG_DIR: /app/storage/logs/calls
      API_HOST: 0.0.0.0
      API_PORT: 8000
    command: ["postop-admin"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./dataset/textos:/app/dataset/textos
      - ./storage/protocols:/app/storage/protocols
      - ./storage/logs:/app/storage/logs
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant-db:
        condition: service_healthy
    networks:
      - postop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/openapi.json"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  backend-voice:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: postop-backend-voice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: 6333
      TEXTOS_DIR: /app/dataset/textos
      PROTOCOL_DIR: /app/storage/protocols
      CALLS_LOG_DIR: /app/storage/logs/calls
      VOICE_WEB_HOST: 0.0.0.0
      VOICE_WEB_PORT: 7860
      VOICE_WEB_CORS_ORIGINS: ${VOICE_WEB_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    command: ["postop-voice-web"]
    ports:
      - "${VOICE_WEB_PORT:-7860}:7860"
    volumes:
      - ./dataset/textos:/app/dataset/textos
      - ./storage/protocols:/app/storage/protocols
      - ./storage/logs:/app/storage/logs
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant-db:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    networks:
      - postop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7860/status"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend-paciente:
    build:
      context: ./apps/voice-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_VOICE_API_URL: ${NEXT_PUBLIC_VOICE_API_URL:-http://localhost:7860}
    container_name: postop-frontend-paciente
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_VOICE_API_URL: ${NEXT_PUBLIC_VOICE_API_URL:-http://localhost:7860}
      VOICE_API_URL: http://backend-voice:7860
    ports:
      - "${FRONTEND_PACIENTE_PORT:-3000}:3000"
    depends_on:
      backend-voice:
        condition: service_healthy
    networks:
      - postop-net

  frontend-admin:
    build:
      context: ./apps/admin-ui
      dockerfile: Dockerfile
    container_name: postop-frontend-admin
    restart: unless-stopped
    ports:
      - "${FRONTEND_ADMIN_PORT:-8080}:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - postop-net

  jupyter-notebook:
    build:
      context: .
      dockerfile: Dockerfile
      target: jupyter
    container_name: postop-jupyter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: 6333
      TEXTOS_DIR: /app/dataset/textos
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./dataset/textos:/app/dataset/textos
      - ./data:/app/data
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant-db:
        condition: service_healthy
    networks:
      - postop-net

  ingest-init:
    profiles: ["init"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: postop-ingest-init
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: 6333
      TEXTOS_DIR: /app/dataset/textos
      PROTOCOL_DIR: /app/storage/protocols
    command: ["postop-ingest", "--recreate"]
    volumes:
      - ./dataset/textos:/app/dataset/textos
      - ./storage/protocols:/app/storage/protocols
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant-db:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    networks:
      - postop-net

networks:
  postop-net:
    driver: bridge

volumes:
  qdrant_data:
  hf_cache:
