[project]
name = "postop-voice-agent"
version = "0.1.0"
description = "Post-operative voice agent with clinical RAG and decision logic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.0.0",
    "fastapi>=0.115.0",
    "groq>=0.22.0",
    "kokoro>=0.9.4",
    "loguru>=0.7.3",
    "numpy>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.19.0,<1.20.0",
    "sentence-transformers>=3.4.0",
    "soundfile>=0.13.0",
    "torch>=2.5.0",
    "transformers>=4.48.0",
    "uvicorn[standard]>=0.34.0",
    "pipecat-ai[deepgram,local,runner,silero,webrtc]>=0.0.80",
]

[project.scripts]
postop-ingest = "knowledge.cli.ingest:main"
postop-admin = "api.main:main"
postop-voice = "voice.main:main"
postop-voice-web = "voice.web_server:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "jupyter>=1.1.1",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "knowledge", "agent", "api", "voice"]
