[project]
name = "postop-voice-agent"
version = "0.1.0"
description = "Post-operative voice agent with clinical RAG and decision logic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.22.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.0",
    "qdrant-client>=1.19.0,<1.20.0",
    "sentence-transformers>=3.4.0",
    "torch>=2.5.0",
    "transformers>=4.48.0",
]

[project.scripts]
postop-ingest = "knowledge.cli.ingest:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "jupyter>=1.1.1",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "knowledge", "agent"]
